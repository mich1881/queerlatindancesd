<body>
  <div class="container">

    <!-- Single QR Generation -->
     <label for="eventDate" style="margin-right:0.5em;">Event Date:</label>
<input type="text" id="eventDate" value="Jul 24th, 2026, 6:30pm – 10:30pm" style="padding:0.5em 1em; border-radius:8px; border:2px solid #ffb6c1; margin-bottom:1em;">
<div id="guestList" class="input-group">

</div>
<button class="btn-secondary btn-small" onclick="addGuestEntry()">+ Add Another Guest</button>
<button class="btn-primary" onclick="generateMultiple()">Generate QR Codes</button>

  <script>
    let generatedCodes = [];

    // Load event date + time from events-data.json
    async function loadEventDate() {
      try {
        const res = await fetch('/events-data.json');
        const data = await res.json();
        const upcoming = data.upcoming;
        if (upcoming && upcoming.length > 0) {
          const nextEvent = upcoming[0];
          const dateObj = new Date(nextEvent.date + 'T12:00:00');
          const month = dateObj.toLocaleString('en-US', { month: 'long' });
          const day = dateObj.getDate();
          const year = dateObj.getFullYear();
          const suffix = day === 1 ? 'st' : day === 2 ? 'nd' : day === 3 ? 'rd' : 'th';
          const time = nextEvent.time || '6:30pm – 10:30pm';
          const formatted = `${month} ${day}${suffix}, ${year}, ${time}`;
          document.getElementById('eventDate').value = formatted;
        }
      } catch (err) {
        console.log('Could not load event date:', err);
      }
    }
    loadEventDate();

function generateUniqueId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let id;
  do {
    id = 'QLDSD-';
    for (let i = 0; i < 6; i++) {
      id += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    // Keep generating if this code already exists
  } while (generatedCodes.some(codeObj => codeObj.code === id));
  return id;
}
function sendQrEmailToWorker(guestName, guestEmail, uniqueId, preferredName, role) {
  const eventDate = document.getElementById('eventDate').value || '';
  const subject = `Queer Latin Dance Social: Afterglow - Confirmation Ticket`;
  const html = buildEmailHtml({
    guestName,
    qrCode: uniqueId,
    preferredName,
    role,
    eventDate
  });

  fetch('https://sparkling-art-bed4.michf18.workers.dev/api/send-qr-email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      guestName,
      guestEmail,
      qrCode: uniqueId,
      preferredName,
      role,
      eventDate,
      subject,
      html 
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      // Now add to spreadsheet
      fetch('https://sparkling-art-bed4.michf18.workers.dev/api/add-guest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          guestName,
          guestEmail,
          qrCode: uniqueId,
          preferredName,
          role,
          eventDate
        })
      })
      .then(res => res.json())
      .then(sheetData => {
        if (sheetData.success) {
          alert('Email sent and guest added to spreadsheet!');
        } else {
          alert('Email sent, but spreadsheet update failed: ' + sheetData.error);
        }
      });
    } else {
      alert('Error sending email: ' + data.error);
    }
  });
  updateCodeList();
  document.getElementById('downloadAllBtn').style.display = 'none';
  localStorage.setItem('qldsdGeneratedCodes', JSON.stringify(generatedCodes));
}
function generateSingle() {
  const guestName = document.getElementById('guestName').value.trim() || 'Guest';
  const guestEmailRaw = document.getElementById('guestEmail').value.trim() || '';
  const preferredName = document.querySelector('.preferredNameBox').value.trim();
  const role = document.querySelector('.roleBox').value.trim();
  const uniqueId = generateUniqueId();

  // Split emails by comma and trim spaces
  const guestEmails = guestEmailRaw.split(',').map(e => e.trim()).filter(e => e);

  const output = document.getElementById('qrOutput');
  output.innerHTML = '';
  generatedCodes = [];

  const item = createQRItem(guestName, guestEmails.join(', '), uniqueId, 200);
  output.appendChild(item);

  // Add "Send Email" button for each email
  guestEmails.forEach(email => {
    const emailBtn = document.createElement('button');
    emailBtn.className = 'btn-secondary btn-small';
    emailBtn.textContent = `✉️ Send Email to ${email}`;
    emailBtn.style.marginTop = '0.5em';
    emailBtn.onclick = () => sendQrEmailToWorker(guestName, email, uniqueId, preferredName, role);
    item.appendChild(emailBtn);
  });

  generatedCodes.push({ name: guestName, preferredName, role, email: guestEmails.join(', '), code: uniqueId });

  updateCodeList();

  document.getElementById('guestName').value = '';
  document.getElementById('guestEmail').value = '';
  document.getElementById('downloadAllBtn').style.display = 'none';

  localStorage.setItem('qldsdGeneratedCodes', JSON.stringify(generatedCodes));
}

    function generateBatch() {
      const num = parseInt(document.getElementById('numCodes').value) || 10;
      const output = document.getElementById('qrOutput');
      output.innerHTML = '';
      generatedCodes = [];
      
      for (let i = 1; i <= num; i++) {
        const uniqueId = generateUniqueId();
        const guestName = `Guest ${i}`;
        
        const item = createQRItem(guestName, '', uniqueId, 150);
        output.appendChild(item);
        
        generatedCodes.push({ name: guestName, email: '', code: uniqueId });
      }
      
      updateCodeList();
      document.getElementById('downloadAllBtn').style.display = 'inline-block';
      localStorage.setItem('qldsdGeneratedCodes', JSON.stringify(generatedCodes));
    }

    function createQRItem(guestName, guestEmail, uniqueId, size) {
      const item = document.createElement('div');
      item.className = 'qr-item';
      item.dataset.code = uniqueId;
      item.dataset.name = guestName;
      
      // Create a container div for the QR code
      const qrContainer = document.createElement('div');
      qrContainer.className = 'qr-container';
      qrContainer.id = `qr-${uniqueId}`;
      item.appendChild(qrContainer);
      
      const codeText = document.createElement('div');
      codeText.className = 'qr-code-text';
      codeText.textContent = uniqueId;
      item.appendChild(codeText);
      
      const nameText = document.createElement('div');
      nameText.className = 'qr-guest-name';
      nameText.textContent = guestName;
      item.appendChild(nameText);
      
      const downloadBtn = document.createElement('button');
      downloadBtn.className = 'btn-primary btn-small';
      downloadBtn.textContent = '⬇️ Download';
      downloadBtn.style.marginTop = '0.5em';
      downloadBtn.onclick = () => downloadQR(qrContainer, `${guestName.replace(/\s+/g, '-')}-${uniqueId}.png`);
      item.appendChild(downloadBtn);
      
      // Generate QR code using qrcodejs library
      setTimeout(() => {
        new QRCode(qrContainer, {
          text: uniqueId,
          width: size,
          height: size,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }, 10);
      
      return item;
    }

function updateCodeList() {
  document.getElementById('codeList').style.display = 'block';

  // Header: Actual Name, Preferred Name, Email, Checked In, Printed, Role, QR Code, CheckIn Time
  const headerArr = [
    'Actual Name', 'Preferred Name', 'Email', 'Checked In', 'Printed', 'Role', 'QR Code', 'CheckIn Time'
  ];
  const header = headerArr.join('\t');
  const rows = generatedCodes.map(g =>
    [
      g.name,         // Actual Name
      g.preferredName || '', // Preferred Name
      g.email,        // Email
      '',        // Checked In
      '',        // Printed
      g.role || '', // Role
      g.code,         // QR Code
      ''              // CheckIn Time
    ]
  );

  // Update textarea
  const textRows = rows.map(r => r.join('\t'));
  document.getElementById('codeListText').value = header + '\n' + textRows.join('\n');

  // Render HTML table preview
  let html = '<table style="border-collapse:collapse;width:100%;font-size:0.95em;">';
  html += '<tr>' + headerArr.map(h => `<th style="border:1px solid #ccc;padding:4px 8px;background:#f8f4ff;">${h}</th>`).join('') + '</tr>';
  rows.forEach(r => {
    html += '<tr>' + r.map(cell => `<td style="border:1px solid #eee;padding:4px 8px;">${cell}</td>`).join('') + '</tr>';
  });
  html += '</table>';
  document.getElementById('codeListTablePreview').innerHTML = html;
}

    function downloadQR(qrContainer, filename) {
  // Find the canvas or img inside the QR container
  const canvas = qrContainer.querySelector('canvas');
  const img = qrContainer.querySelector('img');
  const qrSize = 200; // or 150 for batch, adjust as needed
  const border = Math.round(qrSize * 0.08);
  const textHeight = Math.round(qrSize * 0.32);
  const width = qrSize + border * 2;
  const height = qrSize + border * 2 + textHeight;

  // Get order number and name from parent .qr-item
  const qrItem = qrContainer.closest('.qr-item');
  let orderNum = '';
  let guestName = '';
  if (qrItem) {
    guestName = qrItem.dataset.name || '';
    orderNum = qrItem.dataset.code || ''; // Use the QR code as the order number
  }

  // Create a new canvas for the final image
  const finalCanvas = document.createElement('canvas');
  finalCanvas.width = width;
  finalCanvas.height = height;
  const ctx = finalCanvas.getContext('2d');

  // Draw white background
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, width, height);

  // Draw border
  ctx.strokeStyle = "#e75480";
  ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, width - 6, height - 6);

  // Draw QR code
  if (canvas) {
    ctx.drawImage(canvas, border, border, qrSize, qrSize);
  } else if (img) {
    ctx.drawImage(img, border, border, qrSize, qrSize);
  } else {
    alert('QR code not ready yet. Please try again.');
    return;
  }

  // Scale font size based on QR code size for sharpness
  const mainFontSize = Math.round(qrSize * 0.13); // e.g. 26px for 200, 78px for 600
  const subFontSize = Math.round(qrSize * 0.09);

  ctx.font = `bold ${mainFontSize}px Arial`;
  ctx.fillStyle = "#e75480";
  ctx.textAlign = "center";
  ctx.fillText(orderNum, width / 2, qrSize + border + mainFontSize);

  ctx.font = `${subFontSize}px Arial`;
  ctx.fillStyle = "#333";
  ctx.fillText(guestName, width / 2, qrSize + border + mainFontSize + subFontSize + 8);

  // Download the canvas as PNG
  const link = document.createElement('a');
  link.download = filename;
  link.href = finalCanvas.toDataURL('image/png');
  link.click();
}

function clearAllCodes() {
  if (confirm('Are you sure you want to clear all generated codes?')) {
    generatedCodes = [];
    localStorage.removeItem('qldsdGeneratedCodes');
    updateCodeList();
    document.getElementById('qrOutput').innerHTML = '';
    document.getElementById('downloadAllBtn').style.display = 'none';
  }
}
function draftEmail(guestName, guestEmail, uniqueId, qrContainer) {
  // Try to get QR image data URL
  const canvas = qrContainer.querySelector('canvas');
  let imgDataUrl = '';
  if (canvas) {
    imgDataUrl = canvas.toDataURL('image/png');
  }

  // Compose email body (plain text + image link)
  let body = `Hi ${guestName}, %0A%0A This is a payment confirmation email for your Queer Salsa Social event ticket(s). Your QR code for check-in is below:%0A%0A`;
  body += `Code: ${uniqueId}%0A%0A`;

  // Add image as a link (cannot embed image in mailto)
  if (imgDataUrl) {
    body += `View QR code image: ${imgDataUrl}%0A%0A`;
  } else {
    body += `QR code image not available.%0A%0A`;
  }

  body += `See you at the event!`;

  // Compose mailto link
  const mailto = `mailto:${guestEmail}?subject=Your%20Check-in%20QR%20Code&body=${body}`;

  // Open default mail client
  window.open(mailto, '_blank');
}

function generateMultiple() {
  const guestNames = Array.from(document.querySelectorAll('.guestNameBox')).map(e => e.value.trim());
  const preferredNames = Array.from(document.querySelectorAll('.preferredNameBox')).map(e => e.value.trim());
  const rolesList = Array.from(document.querySelectorAll('.roleBox')).map(e => e.value.trim());
  const guestEmails = Array.from(document.querySelectorAll('.guestEmailBox')).map(e => e.value.trim());
  const output = document.getElementById('qrOutput');
  output.innerHTML = '';
  generatedCodes = [];

  guestNames.forEach((name, idx) => {
    const email = guestEmails[idx];
    const preferredName = preferredNames[idx];
    const role = rolesList[idx];
    if (name && email) {
      const uniqueId = generateUniqueId();
      const item = createQRItem(name, email, uniqueId, 200);
      output.appendChild(item);

      // Add "Send Email" button
      const emailBtn = document.createElement('button');
      emailBtn.className = 'btn-secondary btn-small';
      emailBtn.textContent = `✉️ Send Email to ${email}`;
      emailBtn.style.marginTop = '0.5em';
      emailBtn.onclick = () => sendQrEmailToWorker(name, email, uniqueId, preferredName, role);
      item.appendChild(emailBtn);

      generatedCodes.push({ name, preferredName, role, email, code: uniqueId });
    }
  });

  updateCodeList();
  document.getElementById('downloadAllBtn').style.display = 'none';
  localStorage.setItem('qldsdGeneratedCodes', JSON.stringify(generatedCodes));
}
  </script>
</body>
</html>

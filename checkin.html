<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QLDSD Event Check-In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #c1bff8;
      font-family: 'PassionOne','Signika', Arial, sans-serif;
      margin: 0;
    }
    .checkin-container {
      background: #fff0f6;
      border-radius: 22px;
      box-shadow: 0 4px 32px rgba(255, 105, 180, 0.13);
      padding: 2.5em 2em 2em 2em;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .checkin-footer {
      font-size: 1.5em;
      color: #8354c0;
      font-weight: 1000;
    }
    h2 {
      color: #e75480;
      margin-bottom: 1.0em;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    h3 {
      color: #8354c0;
      margin-bottom: 0.0em;
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 0.2em;
    }
    input[type="text"] {
      width: 90%;
      padding: 0.8em;
      font-size: 1.1em;
      border: .5px solid #ffb6c1;
      border-radius: 10px;
      margin-bottom: 1em;
      outline: none;
      background: #fff;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #e75480;
    }
    button, .stripe-pay-btn {
      padding: 0.7em 1.5em;
      font-size: 1.1em;
      border: none;
      border-radius: 10px;
      background:#e75480;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      margin: 0.5em 0.3em;
      transition: background 0.2s, transform 0.1s;
      display: inline-block;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(12, 1, 7, 0.08);
    }
    button:active, .stripe-pay-btn:active {
      transform: scale(0.97);
    }
    #result {
      margin: 1.2em 0 0.5em 0;
      font-size: 1.1em;
      min-height: 2em;
      color: #e75480;
      font-weight: 700;
    }
    #result.success {
      color: #c2185b;
    }
    #result.error {
      color: #b8002e;
    }
    #ticketToPrint {
      display: none;
    }
    .popup-bg {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(255,182,193,0.25);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .popup-bg.active {
      display: flex;
    }

    .popup {
      background: #fff0f6;
      border-radius: 16px;
      padding: 2em 2em 1.5em 2em;
      box-shadow: 0 4px 24px rgba(255, 105, 180, 0.13);
      text-align: center;
      max-width: 320px;
      margin: auto;
      border: 2px solid #ffb6c1;
    }
    .popup h3 {
      color: #e75480;
      margin-bottom: 1em;
      font-size: 1.4em;
    }
    .popup .close-btn {
      margin-top: 1em;
      background: none;
      border: none;
      color: #e75480;
      font-size: 1em;
      cursor: pointer;
      text-decoration: underline;
    }
    .heart {
      color: #e75480;
      font-size: 0.8em;
      margin-top: 0.5em;
      margin-bottom: 0.5em;
      display: block;
      animation: pulse 1.2s infinite;
    }

    .main-flex {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 2em;
}

.flyer-container {
  display: flex;
  align-items: center;
  justify-content: center;
}

.event-flyer {
  max-width: 480px;
  width: 100%;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(255, 105, 180, 0.13);
}

@media (max-width: 900px) {
  .main-flex {
    flex-direction: column;
    align-items: center;
  }
  .flyer-container {
    margin-top: 1.5em;
  }
}
    @keyframes pulse {
      0% { transform: scale(1);}
      50% { transform: scale(1.15);}
      100% { transform: scale(1);}
    }
    @media (max-width: 500px) {
      .checkin-container {
        padding: 1.2em 0.5em 1.5em 0.5em;
      }
      h2 {
        font-size: 1.3rem;
      }
    }
    @media (max-width: 768px) {
  body {
padding-top: 2em;
  max-width: 100vw;
  overflow-x: hidden;
}

.checkin-container {
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  margin: 0 auto;
  padding-left: 1em;
  padding-right: 1em;
}

.main-flex {
  flex-wrap: wrap;
  width: 100%;
  box-sizing: border-box;
}

.flyer-container, .event-flyer {
  max-width: 100%;
  width: 100%;
  box-sizing: border-box;
}
  }

</style>

  <!-- Popup -->
  <div id="checkin-popup" class="popup-bg">

      <button id="popupPrintBtn">Print Ticket</button>

 <script>
const API_URL = 'https://sparkling-art-bed4.michf18.workers.dev/api/checkin';
const GUEST_URL = 'https://sparkling-art-bed4.michf18.workers.dev/api/guest';
let lastCheckedInQuery = "";
async function checkGuest(query) {
  const res = await fetch(GUEST_URL, {
    method: 'POST',
    body: JSON.stringify({ query }),
    headers: { 'Content-Type': 'application/json' }
  });
  return await res.json();
}

async function markCheckIn(query) {
  await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({query, action: 'checkin'}),
    headers: {'Content-Type': 'application/json'}
  });
}

async function markPrinted(query) {
  await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({query, action: 'print'}),
    headers: {'Content-Type': 'application/json'}
  });
}
//CHECKIN HANDLER!!!!!!
document.getElementById('checkinBtn').addEventListener('click', async function() {
  const query = document.getElementById('email').value.trim().toLowerCase();
  document.getElementById('result').className = '';
  if (!query) {
    document.getElementById('result').innerText = "Please enter your name or email.";
    document.getElementById('result').className = 'error';
    return;
  }
    // Get all matching guests (array)
  const guestList = await checkGuest(query);

  // Find the first unchecked guest
  let guest = Array.isArray(guestList)
    ? guestList.find(g => !g.checkedIn)
    : guestList;

  if (!guest || !guest.found) {
    document.getElementById('result').innerText = "No available guest entry found for: " + query + ". Please proceed to payment.";
    document.getElementById('result').className = 'error';
    return;
  }
  // Save guest info for later use
  window._currentGuest = guest;
  window._currentQuery = query;
 
// --- If it's a guest, show preferred name popup ---
// --- If it's a guest, show preferred name popup ---
document.getElementById('preferredNameInput').value = '';
document.getElementById('pronounsInput').value = '';
document.getElementById('namepronouns-popup').classList.add('active');
document.getElementById('result').innerText = "";
document.getElementById('result').className = '';
document.getElementById('email').value = '';
return; 

  document.getElementById('ticketGuestName').textContent = guest.name || guest.email;

  if (guest.checkedIn) {
    if (guest.printed) {
      document.getElementById('result').innerText = "Guest has already checked in & printed their ticket.";
      document.getElementById('result').className = 'error';
      return;
    } else {
      // Already checked in, but not printed: allow printing
      document.getElementById('checkin-popup').classList.add('active');
      document.getElementById('result').innerText = "";
      document.getElementById('result').className = '';
      document.getElementById('email').value = '';
      return;
    }
  }
  await markCheckIn(query);
  lastCheckedInQuery = query;
  document.getElementById('ticketGuestName').textContent = guest.name || guest.email;
  document.getElementById('checkin-popup').classList.add('active');
  document.getElementById('result').innerText = "";
  document.getElementById('result').className = '';
  document.getElementById('email').value = '';
});

document.getElementById('popupPrintBtn').addEventListener('click', async function() {
  if (!lastCheckedInQuery) {
    document.getElementById('result').innerText = "No guest to print for.";
    document.getElementById('result').className = 'error';
    closePopup();
    return;
  }
  // Get all matching guests (array)
  const guestList = await checkGuest(lastCheckedInQuery);

  // Find the first not printed guest
  let guest = Array.isArray(guestList)
    ? guestList.find(g => !g.printed)
    : guestList;

  if (!guest || guest.printed) {
    document.getElementById('result').innerText = "Guest has already signed in & printed their ticket.";
    document.getElementById('result').className = 'error';
    closePopup();
    return;
  }
  await markPrinted(lastCheckedInQuery);
  var ticket = document.getElementById('ticketToPrint').innerHTML;
  var printWindow = window.open('', '', 'width=800,height=600');
  if (!printWindow) {
    document.getElementById('result').innerText = "Popup blocked! Please allow popups to print your ticket.";
    document.getElementById('result').className = 'error';
    closePopup();
    return;
  }
  printWindow.document.write(ticket);
  printWindow.document.close();
  printWindow.focus();
  printWindow.print();
  printWindow.close();
  closePopup();
});
// Handle combined popup submit
document.getElementById('namePronounsSubmitBtn').addEventListener('click', async function() {
  const preferredName = document.getElementById('preferredNameInput').value.trim();
  const pronouns = document.getElementById('pronounsInput').value.trim();
  document.getElementById('namepronouns-popup').classList.remove('active');
  if (!preferredName) {
    document.getElementById('result').innerText = "Please enter your preferred name.";
    document.getElementById('result').className = 'error';
    return;
  }
  document.getElementById('ticketGuestName').textContent = preferredName;
  document.getElementById('ticketPronouns').textContent = pronouns ? pronouns : "";

  // Now check in the guest and set up for printing
  if (window._currentGuest) {
    await markCheckIn(window._currentQuery);
    lastCheckedInQuery = window._currentQuery;
    document.getElementById('checkin-popup').classList.add('active');
    document.getElementById('result').innerText = "";
    document.getElementById('result').className = '';
    document.getElementById('email').value = '';
  }
});

document.getElementById('closeNamePronounsPopupBtn').addEventListener('click', function() {
  document.getElementById('namepronouns-popup').classList.remove('active');
});

}
